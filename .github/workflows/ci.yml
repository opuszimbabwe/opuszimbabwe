name: CI

on:
  push:
    branches: ['main', 'arena/**']
  pull_request:

jobs:
  checks:
    name: Typecheck, build & D1 checks
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: 'false'
      CI: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (app + Pages Functions)
        run: npx tsc --noEmit

      - name: Payment gateway and security checks (isolated mocks)
        run: |
          node_modules/.bin/esbuild functions/api/payments/create.ts functions/api/payments/status.ts functions/api/payments/webhook.ts functions/api/payments/config.ts functions/api/domains/orders.ts functions/api/domains/catalogue.ts functions/api/domains/check.ts functions/_lib/domains.ts functions/api/admin/services.ts functions/api/admin/receipts.ts functions/api/receipts/view.ts functions/_lib/operations.ts functions/_lib/client-care.ts functions/api/admin/client-care.ts functions/api/care/orders.ts functions/api/care/documents.ts functions/api/maintenance/project-events.ts --outbase=functions --outdir=/tmp/opus-payments-test --bundle --platform=node --format=cjs
          node scripts/test-payments.cjs
          node scripts/test-domains.cjs
          node scripts/test-admin-receipts.cjs
          node scripts/test-client-care.cjs
          node scripts/test-project-events.cjs
          node_modules/.bin/esbuild functions/_lib/care.ts functions/api/admin/care.ts functions/api/admin/care-pdf.ts functions/api/maintenance/tick.ts functions/api/care-plans.ts --outbase=functions --outdir=/tmp/opus-care-test --bundle --platform=node --format=cjs
          node scripts/test-care.cjs
          node_modules/.bin/esbuild lib/service-presentations.ts --bundle --platform=node --format=cjs --outfile=/tmp/opus-service-presentations-lib.cjs
          node scripts/test-service-presentations.cjs
          node_modules/.bin/esbuild scripts/test-content-settings.ts --bundle --platform=node --format=cjs --outfile=/tmp/opus-content-settings-test.cjs
          node --test /tmp/opus-content-settings-test.cjs

      - name: Build static export
        run: npm run build

      - name: Apply D1 migrations (local)
        run: npx wrangler d1 migrations apply opuszim-content --local

      - name: Database content checks
        run: npm run db:check
