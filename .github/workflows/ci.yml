name: CI

on:
  push:
    branches: ['main', 'arena/**']
  pull_request:

jobs:
  recovery:
    name: Verify recovered production snapshot
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      source_complete: ${{ steps.state.outputs.source_complete }}
    steps:
      - uses: actions/checkout@v4
      - name: Test Opus Pay deployment lock
        run: python3 ops/activation/test-checkout-guard.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ops/recovery/package-lock.json
      - name: Install recovery verification dependencies
        run: npm ci --prefix ops/recovery --ignore-scripts --no-audit --no-fund
      - name: Verify exact production artifacts and recovered source
        run: npm run verify --prefix ops/recovery
      - name: Check tracked files for sensitive material
        run: python3 ops/recovery/check-safe-files.py
      - name: Check recovery status and production build guard
        id: state
        run: |
          node <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict'),{spawnSync}=require('node:child_process');
          const status=JSON.parse(fs.readFileSync('production/state/recovery-status.json'));
          const complete=Boolean(status.pages_functions_source_complete||status.reconstruction_release_ready);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'source_complete='+String(complete)+'\n');
          const guard=spawnSync(process.execPath,['scripts/require-live-source.cjs'],{encoding:'utf8'});
          assert.equal(guard.status,complete?0:2);
          console.log(complete?'Pages source marked recovered; run application checks.':'Recovery verified; production deployment remains blocked until Pages source recovery is complete.');
          NODE

  reconstructed-functions:
    name: Reconstructed API, security and Cloudflare runtime checks
    needs: recovery
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      WRANGLER_SEND_METRICS: 'false'
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked application dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck all source
        run: npm run typecheck
      - name: Test reconstructed routes and generated Pages runtime
        run: npm run test:reconstructed
      - name: Preserve published frontend and checkout artifacts
        run: node scripts/prepare-mastercard-release.cjs && node scripts/test-preserved-release.cjs && node scripts/build-opus-pay-release.cjs && node scripts/test-opus-pay-release.cjs
      - name: Existing payment, domain, receipt and care regressions
        run: |
          node_modules/.bin/esbuild functions/api/payments/create.ts functions/api/payments/status.ts functions/api/payments/webhook.ts functions/api/payments/config.ts functions/api/domains/orders.ts functions/api/domains/catalogue.ts functions/api/domains/check.ts functions/_lib/domains.ts functions/api/admin/services.ts functions/api/admin/receipts.ts functions/api/receipts/view.ts functions/_lib/operations.ts functions/_lib/client-care.ts functions/api/admin/client-care.ts functions/api/care/orders.ts functions/api/care/documents.ts functions/api/maintenance/project-events.ts --outbase=functions --outdir=/tmp/opus-payments-test --bundle --platform=node --format=cjs
          node scripts/test-payments.cjs
          node scripts/test-opus-pay-paynow.cjs
          node scripts/test-payment-admin-notifications.cjs
          node scripts/test-domains.cjs
          node scripts/test-admin-receipts.cjs
          node scripts/test-client-care.cjs
          node scripts/test-project-events.cjs
          node_modules/.bin/esbuild functions/_lib/care.ts functions/api/admin/care.ts functions/api/admin/care-pdf.ts functions/api/maintenance/tick.ts functions/api/care-plans.ts --outbase=functions --outdir=/tmp/opus-care-test --bundle --platform=node --format=cjs
          node scripts/test-care.cjs

  checks:
    needs: recovery
    if: needs.recovery.outputs.source_complete == 'true'
    name: Typecheck, build & D1 checks
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: 'false'
      CI: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (app + Pages Functions)
        run: npx tsc --noEmit

      - name: Payment gateway and security checks (isolated mocks)
        run: |
          node_modules/.bin/esbuild functions/api/payments/create.ts functions/api/payments/status.ts functions/api/payments/webhook.ts functions/api/payments/config.ts functions/api/domains/orders.ts functions/api/domains/catalogue.ts functions/api/domains/check.ts functions/_lib/domains.ts functions/api/admin/services.ts functions/api/admin/receipts.ts functions/api/receipts/view.ts functions/_lib/operations.ts functions/_lib/client-care.ts functions/api/admin/client-care.ts functions/api/care/orders.ts functions/api/care/documents.ts functions/api/maintenance/project-events.ts --outbase=functions --outdir=/tmp/opus-payments-test --bundle --platform=node --format=cjs
          node scripts/test-payments.cjs
          node scripts/test-opus-pay-paynow.cjs
          node scripts/test-payment-admin-notifications.cjs
          node scripts/test-domains.cjs
          node scripts/test-admin-receipts.cjs
          node scripts/test-client-care.cjs
          node scripts/test-project-events.cjs
          node_modules/.bin/esbuild functions/_lib/care.ts functions/api/admin/care.ts functions/api/admin/care-pdf.ts functions/api/maintenance/tick.ts functions/api/care-plans.ts --outbase=functions --outdir=/tmp/opus-care-test --bundle --platform=node --format=cjs
          node scripts/test-care.cjs
          node_modules/.bin/esbuild lib/service-presentations.ts --bundle --platform=node --format=cjs --outfile=/tmp/opus-service-presentations-lib.cjs
          node scripts/test-service-presentations.cjs
          node_modules/.bin/esbuild scripts/test-content-settings.ts --bundle --platform=node --format=cjs --outfile=/tmp/opus-content-settings-test.cjs
          node --test /tmp/opus-content-settings-test.cjs

      - name: Build static export
        run: npm run build

      - name: Apply D1 migrations (local)
        run: npx wrangler d1 migrations apply opuszim-content --local

      - name: Database content checks
        run: npm run db:check
