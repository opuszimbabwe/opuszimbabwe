name: CI

on:
  push:
    branches: ['main', 'arena/**']
  pull_request:

jobs:
  checks:
    name: Typecheck, build & D1 checks
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: 'false'
      CI: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (app + Pages Functions)
        run: npx tsc --noEmit

      - name: Build static export
        run: npm run build

      - name: Apply D1 migrations (local)
        run: npx wrangler d1 migrations apply opuszim-content --local

      - name: Database content checks
        run: npm run db:check
