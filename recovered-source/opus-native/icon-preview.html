<!doctype html><meta charset=utf-8><title>Native icon checks</title><style>*{box-sizing:border-box}body{margin:0;padding:40px;background:#eee;font:14px system-ui;color:#222}.row{display:flex;gap:32px;margin:24px 0}.mask{width:216px;height:216px;background:white;overflow:hidden;position:relative;border:0;box-shadow:0 4px 12px #0002}.circle{border-radius:50%}.squircle{border-radius:28%}.native{position:absolute;width:324px;height:324px;left:-54px;top:-54px}.native img{position:absolute;width:60%;height:60%;top:20%;left:20%}.bar{display:flex;align-items:center;gap:30px;height:96px;padding:20px 30px;border-radius:12px;width:460px}.dark{background:#121212;color:#eee}.light{background:#fff}.bar img{object-fit:contain;width:48px;height:48px}.bar img.small{width:32px;height:32px}</style><h2>Android native adaptive masks</h2><div class=row><div class="mask circle"><div class=native><img src="android/res/drawable/icon_foreground.png"></div></div><div class="mask squircle"><div class=native><img src="android/res/drawable/icon_foreground.png"></div></div></div><h2>Windows transparent icons at native sizes</h2><div class=row><div class="bar dark"><img src="windows/icons/icon-dark.png"><img class=small src="windows/icons/icon-dark.png"><span>Dark Windows</span></div><div class="bar light"><img src="windows/icons/icon-light.png"><img class=small src="windows/icons/icon-light.png"><span>Light Windows</span></div></div>
